  </defs>
  <rect width="1200" height="700" fill="url(#bg)" rx="30"/>
  <text x="600" y="250" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="56" font-weight="700" fill="#f9fafb">DROP BAŞLADI!</text>
  <text x="600" y="310" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="28" fill="#d1d5db">İlk butona basan kazanır</text>
